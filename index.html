<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Sync <html lang> with the i18n locale before React mounts so that
      // screen readers and CSS :lang() selectors see the correct language.
      // The i18n module reads from the same key (ai-agent-locale) and
      // defaults to 'zh-CN', so the values stay in lockstep.
      (function () {
        try {
          var stored = localStorage.getItem('ai-agent-locale');
          var lang = (stored === 'en-US' || stored === 'zh-CN') ? stored : 'zh-CN';
          document.documentElement.lang = lang;
        } catch (e) {
          document.documentElement.lang = 'zh-CN';
        }
      })();
    </script>
    <!--
      Keep CSP out of the dev HTML entrypoint.
      In Tauri/Vite dev, an inline meta CSP here can block module bootstrap or HMR
      before React mounts, which shows up as a pure white window with no fallback UI.
      Production CSP is still enforced through the Tauri app config.
    -->
    <!-- Modern High-End Typography (Inter & Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <title>AI Agent</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
